# ============================================================
#  JPPlayerVaults Documentation - MkDocs Material configuration
# ============================================================
#  Preview locally:   mkdocs serve    ->  http://127.0.0.1:8000
#  Build the site:    mkdocs build    ->  site/
#
#  >>> PUBLISHING: the URLs below are set for the GitHub account
#  >>> "Nameeees" and the repository "jpvaults-docs".
#  >>> If you rename the repo or move it to another account, update
#  >>> the 3 URLs below and the git remote:
#  >>>   git remote set-url origin https://github.com/<user>/<repo>.git
# ============================================================

site_name: JPPlayerVaults Docs
site_author: JP
site_description: >-
  Private, rank-based player vaults for Minecraft 1.8 to the latest version.
  One jar, no dependencies, built to protect items.
site_url: https://nameeees.github.io/jpvaults-docs/

repo_url: https://github.com/Nameeees/jpvaults-docs
repo_name: Nameeees/jpvaults-docs
edit_uri: edit/main/docs/

copyright: JPPlayerVaults by JP — MIT licensed. Minecraft is a trademark of Mojang AB.

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - navigation.path
    - navigation.instant
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    scheme: slate
    primary: green
    accent: green

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Nameeees/JPPlayerVaults
      name: Plugin source code
    - icon: fontawesome/brands/github
      link: https://github.com/Nameeees/jpvaults-docs
      name: Documentation repository
    - icon: fontawesome/brands/discord
      link: https://discord.gg/HATd9QgukF
      name: Community Discord

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
      - Languages & messages: getting-started/languages.md
  - Features: features.md
  - Reference:
      - Commands: reference/commands.md
      - Permissions: reference/permissions.md
  - Data safety: data-safety.md
  - Compatibility: compatibility.md
  - FAQ: faq.md
  - Changelog: changelog.md
